<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学習ルーティーン日記</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#0b57d0" />
</head>
<body>
  <header class="header">
    <h1>学習ルーティーン日記</h1>
    <div class="sub">2/26 期末テスト向け（2026年）</div>
  </header>

  <main class="container">
    <section class="card">
      <div class="row">
        <div>
          <div class="label">今日</div>
          <div id="todayText" class="today"></div>
        </div>
        <button id="openSettings" class="btn btn-ghost">設定</button>
      </div>

      <div id="planBox" class="planBox"></div>

      <div class="actions">
        <button id="btnDone" class="btn btn-done">完了</button>
        <button id="btnFail" class="btn btn-fail">×</button>
      </div>

      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>履歴</h2>
        <div class="toggle">
          <button id="tabList" class="btn btn-small btn-active">一覧</button>
          <button id="tabCalendar" class="btn btn-small">カレンダー</button>
        </div>
      </div>

      <div id="stats" class="stats"></div>

      <div id="historyList" class="history"></div>
      <div id="historyCalendar" class="calendar hidden"></div>
    </section>
  </main>

  <!-- Settings Modal -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialogInner">
      <h3>設定</h3>

      <div class="field">
        <label>開始日（YYYY-MM-DD）</label>
        <input id="startDate" type="date" />
      </div>

      <div class="field">
        <label>テスト日（YYYY-MM-DD）</label>
        <input id="testDate" type="date" />
      </div>

      <div class="field">
        <label>直前強化の開始（テスト何日前から増量）</label>
        <input id="boostDays" type="number" min="1" max="30" />
      </div>

      <div class="field">
        <label>教科名（自由に書き換えOK）</label>
        <div class="grid2">
          <input id="subjA" placeholder="教科A（例：数学）" />
          <input id="subjB" placeholder="教科B（例：英語）" />
          <input id="subjC" placeholder="教科C（例：理科）" />
          <input id="subjD" placeholder="教科D（例：社会）" />
        </div>
      </div>

      <div class="field">
        <label>通常期（平日） 合計学習時間</label>
        <input id="weekdayHours" type="number" step="0.5" min="0" max="12" />
      </div>

      <div class="field">
        <label>通常期（火木・塾あり） 合計学習時間</label>
        <input id="jukuHours" type="number" step="0.5" min="0" max="12" />
      </div>

      <div class="field">
        <label>通常期（土日） 合計学習時間</label>
        <input id="weekendHours" type="number" step="0.5" min="0" max="12" />
      </div>

      <div class="field">
        <label>直前強化期（平日） 合計学習時間</label>
        <input id="boostWeekdayHours" type="number" step="0.5" min="0" max="12" />
      </div>

      <div class="field">
        <label>直前強化期（土日） 合計学習時間</label>
        <input id="boostWeekendHours" type="number" step="0.5" min="0" max="12" />
      </div>

      <div class="field">
        <label>データ</label>
        <div class="row">
          <button id="exportBtn" class="btn btn-ghost" type="button">エクスポート（JSON）</button>
          <button id="importBtn" class="btn btn-ghost" type="button">インポート</button>
          <button id="resetBtn" class="btn btn-danger" type="button">全消去</button>
        </div>
        <input id="importFile" type="file" accept="application/json" hidden />
        <div class="hint">端末変更に備えてJSONで移行できます</div>
      </div>

      <menu class="menu">
        <button class="btn btn-ghost" value="cancel">閉じる</button>
        <button id="saveSettings" class="btn" value="default">保存</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
